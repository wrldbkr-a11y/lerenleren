<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leren leren · online cursus</title>
<style>
:root{
  --bg:#f4f6f8; --card:#ffffff; --ink:#1d2733; --muted:#5d6b7a; --line:#dde3ea;
  --accent:#2B4C9A; --accent-soft:#e8eefa;
  --good:#2e8b57; --good-soft:#e5f4ec; --bad:#c0392b; --bad-soft:#fbe7e5;
  --tip:#B07F00; --tip-soft:#FFF6DB;
  --mot:#E4572E; --mot-soft:#FDECE6; --pla:#0F8B83; --pla-soft:#E1F4F2; --stu:#6A4FB3; --stu-soft:#EEEAF8;
  --radius:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:17px;line-height:1.5}
button,input,textarea,select{font:inherit;color:inherit}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 110px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:18px 0 6px}
header h1{font-size:1.3rem;margin:0}
header h1 span{color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin:14px 0}
.card h2{font-size:1.15rem;margin:0 0 10px}
.card h3{font-size:1rem;margin:16px 0 6px}
.muted{color:var(--muted)} .small{font-size:.88rem}
p{margin:8px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:11px 18px;cursor:pointer;font-weight:600;background:var(--accent);color:#fff;min-height:44px;text-decoration:none}
.btn.ghost{background:var(--accent-soft);color:var(--accent)}
.btn.plain{background:none;color:var(--muted);font-weight:500;padding:8px 10px;min-height:0}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
label.l{display:block;font-weight:600;margin:14px 0 6px}
input[type=text],input[type=number],input[type=date],textarea,select{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff}
textarea{min-height:76px;resize:vertical}
input:focus,textarea:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin:6px 0;cursor:pointer;background:#fff}
.opt input{margin-top:4px;width:20px;height:20px;flex:none}
.opt.on{border-color:var(--accent);background:var(--accent-soft)}
.fb{background:var(--accent-soft);border-radius:10px;padding:10px 12px;margin:6px 0 4px}
.box{border-radius:10px;padding:12px 14px;margin:12px 0;border-left:6px solid var(--accent);background:var(--accent-soft)}
.box b.h{display:block;margin-bottom:4px}
.onthoud{border-left-color:#E0A100;background:var(--tip-soft)}
.onthoud .k{font-size:.78rem;letter-spacing:.08em;font-weight:700;color:var(--tip)}
.thuis{background:var(--ink);color:#fff;border-left:0}
.thuis .k{font-size:.78rem;letter-spacing:.08em;font-weight:700;opacity:.8}
table.t{width:100%;border-collapse:collapse;margin:10px 0;font-size:.93rem}
table.t th{background:var(--accent);color:#fff;text-align:left;padding:7px 9px}
table.t td{border:1px solid var(--line);padding:7px 9px;vertical-align:top;background:#fff}
.scale{display:flex;gap:6px;flex-wrap:wrap}
.scale button{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:#fff;cursor:pointer;font-weight:600}
.scale button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.ses{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:12px;margin:8px 0;background:#fff;cursor:pointer;width:100%;text-align:left}
.ses .code{flex:none;width:52px;height:52px;border-radius:12px;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1.15rem}
.ses .grow{flex:1;min-width:0}
.ses .ti{font-weight:700}
.chip{display:inline-block;font-size:.76rem;padding:2px 8px;border-radius:999px;font-weight:700;margin-right:4px}
.chip.ok{background:var(--good-soft);color:var(--good)}
.chip.busy{background:var(--tip-soft);color:var(--tip)}
.chip.must{background:var(--ink);color:#fff}
.top{border-radius:var(--radius);color:#fff;padding:16px 18px;margin-top:10px}
.top .k{font-size:.8rem;letter-spacing:.08em;font-weight:700;opacity:.85}
.top h2{margin:2px 0 4px;font-size:1.35rem}
.prog{height:8px;background:rgba(255,255,255,.35);border-radius:4px;overflow:hidden;margin-top:10px}
.prog i{display:block;height:100%;background:#fff}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 16px;z-index:5}
.nav .in{max-width:720px;margin:0 auto;display:flex;gap:10px}
.nav .in .btn{flex:1}
.say{float:right;margin:-4px -6px 0 8px}
.big{font-size:2rem;font-weight:700}
.timer{font-size:2.4rem;font-weight:700;font-variant-numeric:tabular-nums;text-align:center;margin:8px 0}
.flash{border:2px solid var(--line);border-radius:14px;padding:26px 16px;text-align:center;background:#fff;margin:10px 0}
.flash .w{font-size:1.8rem;font-weight:700}
.flash .a{font-size:1.4rem;color:var(--good);margin-top:8px;min-height:1.6em}
.good{color:var(--good);font-weight:700} .bad{color:var(--bad);font-weight:700}
.q{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0;background:#fff}
.q .row input{flex:1;min-width:120px}
.cnt{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.cnt:first-child{border-top:0}
.cnt .grow{flex:1}
.cnt button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:1.2rem;cursor:pointer}
.cnt b.n{min-width:28px;text-align:center;font-size:1.2rem}
.cornell{display:grid;grid-template-columns:38% 1fr;gap:8px;margin:8px 0}
.breath{width:150px;height:150px;border-radius:50%;background:var(--mot-soft);border:4px solid var(--mot);margin:16px auto;display:flex;align-items:center;justify-content:center;font-weight:700;transition:transform 4s linear}
.breath.in{transform:scale(1.35)}
.kaart svg{width:100%;height:auto;display:block}
.hide{display:none}
img.bewijs{width:100%;border:1px solid var(--line);border-radius:10px;margin:10px 0}
@media (max-width:520px){.cornell{grid-template-columns:1fr}}
@media print{.nav,header,.noprint{display:none}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="nav hide" id="nav"><div class="in" id="navin"></div></div>
<script>
'use strict';
/* ====== instellingen (makkelijk aan te passen) ====== */
const KEY = 'lerenleren_v1';
const DATUM = { M1:'2026-11-10', S1:'2026-11-13', P1:'2026-11-17', S2:'2026-11-20', S3:'2026-11-24', M2:'2026-11-27', P2:null };
const S2_WACHT_DAGEN = 6;   // zoveel dagen na het experiment van S1 kan de test in S2
const PRODUCT = { M1:'je eerste stap en je als-dan-plan', S1:'een Cornell-blad en je eerste kaarten om jezelf te overhoren', P1:'je examenplanning in de studieplanner', S2:'een schema van je eigen leerstof en een vraag voor je leraar', S3:'een oefenreeks voor je tekortvak en je eigen foutenanalyse', M2:'je examenplan voor de avond ervoor en voor als je blokkeert', P2:'je plan voor juni' };
const MODNAAM = { mot:'Motivatie', pla:'Plannen', stu:'Studiemethode' };

/* ====== opslag ====== */
let st;
const KIJK = /kijk/i.test(location.search);
function load(){ try{ st = KIJK ? {} : (JSON.parse(localStorage.getItem(KEY)) || {}); }catch(e){ st = {}; } st.me = st.me || {}; st.ses = st.ses || {}; st.exp = st.exp || {}; }
function save(){ if(KIJK) return; try{ localStorage.setItem(KEY, JSON.stringify(st)); }catch(e){} }
function ses(id){ return st.ses[id] = st.ses[id] || { step:0, a:{} }; }
load();

/* ====== hulpjes ====== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const md = s => esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>');
const plain = s => String(s ?? '').replace(/\*\*?/g,'');
const dagen = ['zo','ma','di','wo','do','vr','za'];
function fmtD(iso){ if(!iso) return ''; const d = new Date(iso+'T12:00'); return dagen[d.getDay()]+' '+d.getDate()+'/'+(d.getMonth()+1); }
function fmtTs(ts){ const d = new Date(ts); return d.getDate()+'/'+(d.getMonth()+1)+'/'+d.getFullYear(); }
function num(x){ if(x==null) return NaN; const m = String(x).replace(',', '.').match(/-?\d+(\.\d+)?/); return m ? parseFloat(m[0]) : NaN; }
function norm(x){ return String(x||'').toLowerCase().trim().replace(/^(de|het|een)\s+/,'').replace(/[^a-zà-ÿ ]/g,'').trim(); }
function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; }

/* voorlezen */
let voice = null;
function pickVoice(){ try{ const v = speechSynthesis.getVoices(); voice = v.find(x=>/nl[-_]BE/i.test(x.lang)) || v.find(x=>/^nl/i.test(x.lang)) || null; }catch(e){} }
if('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function speak(text){ if(!('speechSynthesis' in window)) return; speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(plain(text)); u.lang = voice ? voice.lang : 'nl-BE'; if(voice) u.voice = voice; u.rate = .92; speechSynthesis.speak(u); }

/* ====== experimentmateriaal ====== */
const L1 = [['kiatu','schoen'],['mbwa','hond'],['nyumba','huis'],['maji','water'],['chakula','eten'],['mlima','berg'],['ndege','vogel'],['gari','auto']];
const L2 = [['kiti','stoel'],['paka','kat'],['mti','boom'],['jua','zon'],['mlango','deur'],['samaki','vis'],['kijiko','lepel'],['barabara','weg']];
const MIX = ['mlango','chakula','paka','gari','jua','kiatu','kijiko','mbwa','samaki','nyumba','barabara','mlima','mti','maji','kiti','ndege'];
const ALLW = Object.fromEntries([...L1,...L2]);
const Q = {
  K1:['Een jas kost € 80. Je krijgt 25 % korting. Wat betaal je?',60,'€ 60'],
  K2:['Een fiets kost € 300. De prijs stijgt met 10 %. Wat is de nieuwe prijs?',330,'€ 330'],
  T1:['Na 20 % korting betaal je € 40. Wat was de oorspronkelijke prijs?',50,'€ 50'],
  T2:['Na een stijging van 10 % kost een ticket € 22. Wat kostte het eerst?',20,'€ 20'],
  P1:['Een prijs stijgt van € 50 naar € 60. Met hoeveel procent?',20,'20 %'],
  P2:['Een prijs daalt van € 200 naar € 150. Met hoeveel procent?',25,'25 %'],
};
const SETS = { A:['K1','K2','T1','T2','P1','P2'], B:['T1','K1','P2','K2','P1','T2'] };
const TEST = [['Na 50 % korting kost een spel € 30. Wat kostte het eerst?',60],['Een gsm kost € 400. Je krijgt 15 % korting. Wat betaal je?',340],['Je loon stijgt van € 10 naar € 12 per uur. Met hoeveel procent?',20],['Na een stijging van 25 % kost een abonnement € 50. Wat kostte het eerst?',40]];
const KRT = [
  ['Verklaar waarom veel arbeiders in de 19e eeuw arm waren.','R'],
  ['Benoem twee uitvindingen uit de industriële revolutie.','K'],
  ['Een arbeider krijgt minder loon. Wat kan hij doen? Gebruik H2 en H3.','T'],
  ['Wat is een vakbond?','K'],
  ['Leg het verband tussen de fabrieken en het ontstaan van vakbonden.','R'],
  ['Bekijk een foto van een fabriek uit 1880. Welke kenmerken van de industriële revolutie herken je?','T'],
];
const KRTN = { K:'Kennis', R:'Redeneren', T:'Toepassen' };
const OPDR = [['Benoem','Geef de naam of het begrip, kort.'],['Beschrijf','Vertel hoe iets eruitziet of verloopt, zonder waarom.'],['Verklaar','Leg uit waarom of hoe iets gebeurt: oorzaak en gevolg.'],['Vergelijk','Geef gelijkenissen én verschillen.'],['Leid af','Trek zelf een besluit uit gegevens: een tekst, tabel of grafiek.']];
const FOUT = [['G','Niet geleerd','Vroeger starten, terugplannen, spreiden'],['B','Leerstof niet begrepen','Waarom-vragen, uitleggen, hulp vragen'],['L','Vraag verkeerd gelezen of niet begrepen','Opdrachtwoord en kernwoorden onderlijnen'],['T','Te weinig tijd','Oefenen met een timer, eerst wat je zeker kent'],['S','Slordig','De laatste 5 minuten alles nalezen']];

/* ====== inhoud van de sessies ====== */
const SESSIES = [
{ id:'M1', mod:'mot', title:'Waarom stel ik uit?', doel:'Je ontdekt waarom je uitstelt en je maakt één taak zo klein dat je morgen kan beginnen.', steps:[
  { h:'Vandaag', b:[
    {t:'p', x:'Je werkt ongeveer **20 minuten**. Je doet alles in deze tool. Op het einde maak je een **bewijsblad** en zet je dat in Smartschool.'},
    {t:'p', x:'Werk rustig. Er zijn geen foute antwoorden: het gaat over jou.'},
    {t:'text', req:1, id:'taak', label:'Opdracht 1 · Welke taak voor school stel jij nu uit?', ph:'Bijvoorbeeld: mijn samenvatting voor biologie'},
  ]},
  { h:'Waarom stel je uit?', b:[
    {t:'radio', req:1, id:'reden', label:'Opdracht 2 · Kies wat het meest klopt.', opts:[
      {v:'groot', x:'**Te groot:** ik weet niet waar ik moet beginnen.', fb:'Hak de taak in stukjes van maximaal 15 minuten.'},
      {v:'vaag', x:'**Te vaag:** "studeren" is geen duidelijke opdracht.', fb:'Maak het concreet: wat, welke pagina, hoe lang?'},
      {v:'moeilijk', x:'**Te moeilijk of spannend:** ik denk dat het niet lukt.', fb:'Begin met het makkelijkste stukje, of vraag eerst hulp.'},
      {v:'ver', x:'**Beloning te ver weg:** het levert pas later iets op.', fb:'Haal de beloning dichterbij: afvinken, daarna iets leuks.'},
    ]},
    {t:'onthoud', x:'Uitstellen is geen luiheid. Je brein kiest de beloning van nu. Maak het je brein makkelijker.'},
  ]},
  { h:'Maak het concreet', b:[
    {t:'info', h:'Een goede eerste stap', ol:true, items:['heeft een werkwoord dat je kan zien: lezen, schrijven, maken, opzoeken;','zegt precies wat: welke pagina, oefening of titel;','duurt maximaal 15 minuten.']},
    {t:'p', x:'*Voorbeeld:* niet "Chemie studeren", maar **Chemieboek openen, de titels van hoofdstuk 4 lezen en 3 woorden noteren die ik niet ken (10 min).**'},
    {t:'text', id:'oef', label:'Opdracht 3 · Maak deze taak concreet: "Nederlands taak maken"', long:true},
    {t:'reveal', btn:'Toon een voorbeeld', x:'**De taak openen in Smartschool, de opdracht lezen en de eerste vraag beantwoorden (15 min).** Een werkwoord dat je ziet, precies wat, en kort.'},
  ]},
  { h:'Mijn eerste stap', b:[
    {t:'text', req:1, id:'stap', label:'Opdracht 4 · Mijn eerste stap voor de taak die ik uitstel (wat, waar, hoe lang):', long:true},
    {t:'checks', id:'check', label:'Check je eerste stap.', opts:['Er staat een werkwoord in dat je kan zien.','Er staat precies wat ik doe: pagina, oefening of titel.','Het duurt maximaal 15 minuten.','Ik kan dit morgen starten zonder na te denken.']},
    {t:'p', x:'Kan je niet alles aanvinken? Pas je eerste stap aan.'},
  ]},
  { h:'Mijn plan', b:[
    {t:'text', req:1, id:'alsdan', label:'Opdracht 5 · Als ik … (vast moment), dan doe ik mijn eerste stap.', ph:'Als ik thuiskom en gegeten heb, dan …'},
    {t:'info', h:'Toets jezelf in het kort', items:['Je zet vragen over je leerstof op kaarten: in de tool **Toets jezelf** of op papier.','Elke dag 10 minuten: eerst zelf het antwoord zeggen, dan pas kijken.','De tool kiest welke kaarten terugkomen. In M2 heb je dit nodig.']},
    {t:'link', href:'toets-jezelf.html', x:'Open Toets jezelf'},
    {t:'thuis', x:'Voer je eerste stap één keer echt uit. Neem er een foto van. Die toon je bij de volgende sessie, of je zet ze in Smartschool.'},
  ]},
]},
{ id:'S1', mod:'stu', title:'Ophalen werkt', doel:'Je doet een experiment met je geheugen en je maakt een blad waarmee je jezelf kan overhoren.', steps:[
  { h:'Een experiment', b:[
    {t:'p', x:'Wie studeert door zijn cursus een paar keer te lezen? Vandaag test je of dat werkt. **Jij bent de proefpersoon.**'},
    {t:'p', x:'Je leert twee lijsten woorden in het Swahili, een taal uit Oost-Afrika. Lijst 1 leer je door te **herlezen**. Lijst 2 leer je door jezelf te **overhoren**. Over een week test je wat er overblijft.'},
    {t:'info', h:'Eerlijk spelen', items:['Schrijf de woorden niet op en neem geen foto.','Kijk na deze sessie niet meer naar de woorden.','Doe het experiment in één keer: het duurt 9 minuten.']},
  ]},
  { h:'Lijst 1 · HERLEZEN', b:[ {t:'w', w:'herlees'} ]},
  { h:'Lijst 2 · OVERHOREN', b:[ {t:'w', w:'overhoor'} ]},
  { h:'Mijn voorspelling', b:[
    {t:'radio', req:1, id:'voorspel', label:'Van welke lijst onthoud ik volgende week het meest?', opts:[{v:'her', x:'De lijst die ik HERLAS'},{v:'ovh', x:'De lijst die ik OVERHOORDE'}]},
    {t:'scale', id:'zeker', label:'Hoe zeker ben ik? (1 = niet, 5 = heel zeker)', min:1, max:5},
    {t:'w', w:'s1klok'},
  ]},
  { h:'Mijn Cornell-blad', b:[
    {t:'p', x:'Neem je cursus van je tekortvak. Kies **één titel** uit de les van deze week.'},
    {t:'info', h:'Zo maak je het', ol:true, items:['**Rechts:** de uitleg in maximaal 5 korte blokjes, in je eigen woorden.','**Links:** bij elk blokje een kernwoord en een vraag. Minstens één vraag begint met "Waarom".','**Onderaan:** een samenvatting in één of twee zinnen.']},
    {t:'w', w:'cornell', req:1},
  ]},
  { h:'Overhoor jezelf', b:[
    {t:'p', x:'Je leest je blad niet opnieuw. Je kijkt naar de vraag, zegt de uitleg hardop, en kijkt pas dan.'},
    {t:'w', w:'cornellquiz'},
    {t:'onthoud', x:'Is een Cornell-blad een samenvatting? Rechts staat wel een korte uitleg. Maar je leest het blad niet opnieuw: je dekt rechts af, kijkt naar links en zegt de uitleg. Zo wordt je blad een toets.'},
  ]},
  { h:'Thuis herhalen', b:[
    {t:'onthoud', x:'Kaartjes leggen de basis: begrippen, feiten, de kern van elke titel en waarom-vragen. Dat is het geraamte van je cursus. Toepassen en lange antwoorden oefen je apart.'},
    {t:'checks', id:'dekking', label:'Check', opts:['Ik heb voor elke titel of elk leerdoel minstens één kaartje.']},
    {t:'radio', id:'hoe', label:'Hoe herhaal jij thuis?', opts:[{v:'tool', x:'Met de tool **Toets jezelf**'},{v:'papier', x:'Met **papieren kaartjes** in drie stapeltjes'}]},
    {t:'link', href:'toets-jezelf.html', x:'Open Toets jezelf'},
    {t:'info', h:'Zonder gsm: drie stapeltjes', items:['Vraag op een kaartje, antwoord op de achterkant.','**Stapel 1:** elke dag. **Stapel 2:** om de twee dagen. **Stapel 3:** één keer per week.','Wist je het? Een stapel verder. Niet? Terug naar stapel 1.']},
    {t:'text', req:1, id:'alsdan', label:'Als ik … (vast moment), dan doe ik 10 minuten Toets jezelf.'},
    {t:'thuis', x:'Zet de vragen van je Cornell-blad in Toets jezelf of op kaartjes. Herhaal ze elke dag 10 minuten. Kom over een week terug voor S2: dan test je de woorden.'},
  ]},
]},
{ id:'P1', mod:'pla', title:'Plan terug naar de examens', doel:'Je maakt een examenplanning die past in de tijd die je echt hebt.', steps:[
  { h:'Je studieplanner', b:[
    {t:'p', x:'Open je **studieplanner** in een ander tabblad. Je kreeg er al uitleg over.'},
    {t:'checks', id:'planner', label:'Vink af wat je gedaan hebt.', opts:['Ik heb een examen ingevoerd als taak met een deadline.','Ik heb één studieblok gepland voor morgen.','Ik weet waar ik mijn herhaaloverzicht vind.']},
    {t:'info', h:'Let op', items:['De planner bewaart alles op één toestel, in één browser. Wis je je geschiedenis of gebruik je een ander toestel, dan is je planning weg. Kies één toestel.']},
  ]},
  { h:'Hoeveel tijd heb ik echt?', b:[
    {t:'p', x:'Hoeveel **minuten** kan je per dag studeren voor de examens? Trek eerst de tijd af voor taken en toetsen van de lessen die nog lopen. Sport, werk, familie en hobby’s tellen mee: die tijd is er niet. Hou minstens één avond vrij.'},
    {t:'w', w:'budget', req:1},
  ]},

const BYID = Object.fromEntries(SESSIES.map(s=>[s.id,s]));

/* ====== widgets ====== */
const W = {};
let tick = null;
function stopTick(){ if(tick){ clearInterval(tick); tick = null; } }
function countdown(sec, el, done){ stopTick(); if(KIJK) sec = Math.min(sec, 3); const end = Date.now()+sec*1000; const f = () => { const r = Math.max(0, Math.round((end-Date.now())/1000)); el.textContent = Math.floor(r/60)+':'+String(r%60).padStart(2,'0'); if(r<=0){ stopTick(); done(); } }; f(); tick = setInterval(f, 250); }
function listTable(list){ return '<table class="t"><tr><th>Swahili</th><th>Nederlands</th></tr>'+list.map(([a,b])=>`<tr><td><b>${a}</b></td><td>${b}</td></tr>`).join('')+'</table>'; }
function expLists(){ if(!st.exp.her){ st.exp.her = Math.random()<.5 ? 1 : 2; save(); } return st.exp.her===1 ? {her:L1, ovh:L2} : {her:L2, ovh:L1}; }

W.herlees = { render(a){ return a.herDone ? '<p class="good">✓ Klaar. De lijst is weg. Ga verder naar lijst 2.</p>' : '<p>Je krijgt <b>4 minuten</b>. Lees de woorden en hun betekenis, zo vaak je wil. Dek niets af.</p><div id="wz"><button class="btn wide" id="go">Start (4 minuten)</button></div>'; },
  bind(a){ const go = $('#go'); if(!go) return; go.onclick = () => { const L = expLists(); $('#wz').innerHTML = '<div class="timer" id="tm"></div>'+listTable(L.her); countdown(240, $('#tm'), () => { a.herDone = true; save(); show(); }); }; },
  done(a){ return !!a.herDone; }, sum(a){ return a.herDone ? ['Lijst HERLEZEN: gedaan (4 min)'] : []; } };

W.overhoor = { render(a){ if(a.ovhDone) return '<p class="good">✓ Klaar. Ga verder naar je voorspelling.</p>'; if(!a.herDone) return '<p class="bad">Doe eerst lijst 1.</p>'; return '<p><b>1 minuut</b> lezen. Daarna <b>3 minuten</b> jezelf overhoren: je ziet het woord, je zegt de betekenis, en pas dan kijk je.</p><div id="wz"><button class="btn wide" id="go">Start</button></div>'; },
  bind(a){ const go = $('#go'); if(!go) return; go.onclick = () => { const L = expLists(); $('#wz').innerHTML = '<p class="muted">Lezen</p><div class="timer" id="tm"></div>'+listTable(L.ovh);
      countdown(60, $('#tm'), () => { let deck = shuffle(L.ovh), i = 0;
        $('#wz').innerHTML = '<p class="muted">Overhoren</p><div class="timer" id="tm"></div><div class="flash"><div class="w" id="fw"></div><div class="a" id="fa"></div></div><div class="row"><button class="btn ghost" id="toon" style="flex:1">Toon</button></div><div class="row hide" id="kn"><button class="btn" id="ja" style="flex:1">Wist ik</button><button class="btn ghost" id="nee" style="flex:1">Nog niet</button></div>';

function bindBlocks(step, a){

function bewijsLines(s, a){
  const out = [];
  s.steps.forEach(step => step.b.forEach(b => {
    if(b.t==='w' && W[b.w].sum) out.push(...W[b.w].sum(a, b).map(x=>['',x]));
    else if((b.t==='text'||b.t==='num') && a[b.id]) out.push([plain(b.label), a[b.id]]);
    else if(b.t==='radio' && a[b.id]) out.push([plain(b.label), plain(b.opts.find(o=>o.v===a[b.id]).x)]);
    else if(b.t==='scale' && a[b.id]) out.push([plain(b.label), a[b.id]]);
    else if(b.t==='checks'){ const v = a[b.id]||[]; const on = b.opts.filter((_,i)=>v[i]); if(on.length) out.push([plain(b.label), on.map(plain).join(' · ')]); }
  }));
  return out;
}
function bewijsPng(s, a){

  const col = getComputedStyle(document.documentElement).getPropertyValue('--'+s.mod).trim();
  const wrap = (t, font, max) => { x.font = font; const words = String(t).split(/\s+/), L = []; let line = ''; words.forEach(w => { const tt = line ? line+' '+w : w; if(x.measureText(tt).width > max && line){ L.push(line); line = w; } else line = tt; }); if(line) L.push(line); return L.length ? L : ['']; };
  const items = bewijsLines(s, a); const parts = [];
  items.forEach(([l,v]) => { if(l) parts.push({f:'bold 22px system-ui,sans-serif', c:'#5d6b7a', L:wrap(l,'bold 22px system-ui,sans-serif',Wd-2*pad), gap:14}); parts.push({f:'24px system-ui,sans-serif', c:'#1d2733', L:wrap(v,'24px system-ui,sans-serif',Wd-2*pad), gap: l?4:12}); });
  let H = 230; parts.forEach(p => H += p.gap + p.L.length*32); H += 60;
  c.width = Wd; c.height = H; x.fillStyle = '#fff'; x.fillRect(0,0,Wd,H);
  x.fillStyle = col; x.fillRect(0,0,Wd,150);
  x.fillStyle = '#fff'; x.font = 'bold 22px system-ui,sans-serif'; x.fillText('LEREN LEREN · BEWIJSBLAD · '+MODNAAM[s.mod].toUpperCase(), pad, 48);
  x.font = 'bold 40px system-ui,sans-serif'; x.fillText(s.id+' · '+s.title, pad, 100);

  let y = 190; parts.forEach(p => { y += p.gap; x.font = p.f; x.fillStyle = p.c; p.L.forEach(l => { y += 28; x.fillText(l, pad, y); y += 4; }); });

  $('#next').onclick = () => {
    const open = step.b.find(b => b.t==='w' && W[b.w].done && !W[b.w].done(a));
    if(open && !KIJK){ alertBox('Werk deze stap eerst af.'); return; }
    const leeg = KIJK ? null : step.b.find(b => b.req && !filled(b, a));
    if(leeg){ alertBox('Vul eerst in: '+plain(b_label(leeg))); const el = document.querySelector(`[data-k="${leeg.id}"],[data-r="${leeg.id}"],[data-sc="${leeg.id}"]`); if(el){ el.scrollIntoView({block:'center'}); if(el.focus) el.focus(); } return; }
    if(last){ x.done = a.done = a.done || Date.now(); x.step = 'bewijs'; } else x.step = i+1;
    save(); show(); scrollTo(0,0);
  };
}
function showBewijs(s, x){
  const url = bewijsPng(s, x.a);
  $('#app').innerHTML = `<div class="top" style="background:var(--${s.mod})"><div class="k">${MODNAAM[s.mod].toUpperCase()} · ${s.id}</div><h2>Goed gedaan!</h2><div>Sessie ${s.id} is klaar.</div></div>
    <div class="card"><h2>Je bewijsblad</h2><ol style="padding-left:22px"><li>Druk op <b>Bewijsblad opslaan</b>.</li><li>Zet de afbeelding in Smartschool, bij de opdracht <b>Leren leren ${s.id}</b>.${s.id==='S2'||s.id==='S3'?' Voeg je schermafbeelding van Toets jezelf toe.':''}</li></ol>
    <a class="btn wide" href="${url}" download="Bewijsblad-${s.id}-${(st.me.naam||'leerling').replace(/\W+/g,'-')}.png">Bewijsblad opslaan</a>
    <img class="bewijs" src="${url}" alt="Bewijsblad ${s.id}"></div>`;
  setNav(`<button class="btn ghost" id="aan">Antwoorden aanpassen</button><button class="btn" id="home">Alle sessies</button>`);
  $('#aan').onclick = () => { x.step = 0; save(); show(); scrollTo(0,0); };
  $('#home').onclick = () => { view.s = null; show(); scrollTo(0,0); };
}
show();
</script>
